<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Chess DB</title>
  <style>
    :root { color-scheme: dark; --bg:#171717; --panel:#242424; --light:#f0d9b5; --dark:#b58863; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px Segoe UI, sans-serif; background:var(--bg); color:#eee; }
    main { display:flex; gap:18px; padding:18px; max-width:1160px; margin:auto; }
    #board { display:grid; grid-template-columns:repeat(8,70px); grid-template-rows:repeat(8,70px); width:560px; height:560px; }
    #board-wrap { position:relative; width:560px; height:560px; }
    #annotation-layer { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    .board-tools { width:560px; display:flex; justify-content:flex-end; margin-bottom:6px; }
    .board-tools button { padding:5px 10px; }
    #opening-status { display:none; width:560px; margin-top:8px; padding:8px 10px; background:var(--panel); border-radius:4px; color:#c8d8ff; overflow-wrap:anywhere; }
    .history-controls { width:560px; display:flex; gap:6px; margin-top:8px; }
    .history-controls button { flex:1; font-size:20px; line-height:1; padding:6px; }
    .square { border:0; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1; user-select:none; touch-action:none; }
    .piece-image { width:100%; height:100%; object-fit:contain; transform:scale(1.14); pointer-events:none; }
    .drag-preview { position:fixed; width:62px; height:62px; pointer-events:none; z-index:10; transform:translate(-50%,-50%) scale(1.14); }
    .light { background:var(--light); } .dark { background:var(--dark); }
    .last { background:#c9e6ff !important; }
    .saved { background:#72d572 !important; }
    .selected { background:#f6f669 !important; }
    .saved.selected { background:#f6f669 !important; }
    .coordinate { position:absolute; z-index:2; font:700 11px/1 Segoe UI,sans-serif; pointer-events:none; }
    .coordinate.rank { top:3px; left:4px; }
    .coordinate.file { right:4px; bottom:3px; }
    .square.dark .coordinate { color:#f0d9b5; }
    .square.light .coordinate { color:#b58863; }

    .legal-capture::after { content:""; position:absolute; inset:5px; border:5px solid rgba(55,170,75,.82); border-radius:50%; }
    .legal-castle { box-shadow:inset 0 0 0 5px rgba(55,170,75,.78); }
    .legal-castle::after { content:""; width:16px; height:16px; border-radius:50%; background:rgba(55,170,75,.78); }
    .square { position:relative; }
    aside { width:460px; background:var(--panel); padding:16px; border-radius:6px; }
    input, button { font:inherit; padding:8px; border-radius:4px; border:1px solid #555; }
    input { width:100%; background:#151515; color:#eee; } button { cursor:pointer; background:#363636; color:#fff; }
    button:hover { background:#4b4b4b; } .row { display:flex; gap:8px; margin:7px 0; } .row button { flex:1; }
    label { display:block; margin-top:10px; color:#bbb; } .status { color:#9bd49b; min-height:20px; margin-top:10px; }
    #saved-list, #saved-list-label { display:none; }
    #saved-list button { width:100%; text-align:left; margin:3px 0; }
    #active-jobs-label { display:none; margin-top:14px; }
    #active-jobs { display:none; list-style:none; padding:0; margin:0; }
    #active-jobs li { display:flex; align-items:center; gap:6px; background:#1c1c1c; padding:6px 8px; border-radius:4px; margin:4px 0; font-size:12px; }
    #active-jobs li .job-opening { flex:0 1 190px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; }
    #active-jobs li .job-status { flex:1; color:#9bd49b; }
    #active-jobs li button { padding:3px 8px; flex:0 0 auto; }
    #active-jobs li .job-actions { display:flex; gap:4px; flex:0 0 auto; }
    #material-status { width:560px; margin-top:8px; padding:8px 10px; background:var(--panel); border-radius:4px; }
    .captured-row { display:flex; align-items:center; gap:0; min-height:24px; }
    .captured-label { width:112px; color:#bbb; flex:0 0 auto; }
    .captured-pieces { display:flex; align-items:center; flex:1; min-width:0; }
    .captured-piece-group { display:flex; align-items:center; flex:0 0 auto; }
    .captured-piece-group + .captured-piece-group { margin-left:-8px; }
    .captured-piece { width:23px; height:23px; object-fit:contain; flex:0 0 23px; margin-left:-17px; }
    .captured-piece:first-child { margin-left:0; }
    .material-advantage { margin-left:5px; color:#d9d9d9; font-variant-numeric:tabular-nums; }
    .annotation-arrow { fill:none; stroke-width:9; stroke-linecap:butt; stroke-linejoin:round; opacity:.78; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
    .annotation-circle { stroke-width:3; opacity:.88; }
    @media (max-width: 1080px) {
      main { flex-direction:column; align-items:center; }
      aside { width:min(100%,560px); }
    }
    .notation { min-height:40px; padding:8px; background:#151515; color:#eee; word-break:break-word; }
    #analysis-progress { width:100%; height:18px; display:none; }
    small { color:#aaa; }
  </style>
</head>
<body>
<main>
  <section>
    <div class="board-tools"><button id="flip">↻ Flip board</button></div>
    <div id="board-wrap">
      <div id="board" aria-label="Chess board"></div>
      <svg id="annotation-layer" aria-hidden="true"></svg>
    </div>
    <div id="material-status" aria-live="polite"></div>
    <div class="history-controls" aria-label="Move navigation">

      <button id="history-back" aria-label="Go back one move" title="Go back one move">◀</button>
      <button id="history-forward" aria-label="Go forward one move" title="Go forward one move">▶</button>
      <button id="history-last" aria-label="Go to latest position" title="Go to latest position">▶|</button>
    </div>
    <div id="opening-status" role="status" aria-live="polite">Opening: Starting position</div>
    <small>Scroll over the board to move through the current history.</small><br>
    <small>Right-click a square or drag to annotate; hold Ctrl for red annotations.</small><br>
    <small>Green squares show the saved best move automatically.</small>
  </section>
  <aside>
    <div class="row" id="admin-bar" title="Admin controls gate Remove saved move and analysis depth">
      <input id="admin-token-input" type="password" placeholder="Admin token" style="flex:1">
      <button id="admin-login">Login</button>
    </div>
    <details id="advanced-settings">
      <summary>Position and engine settings</summary>
      <label for="fen">FEN</label>
      <input id="fen">
      <div class="row"><button id="load">Load position</button><button id="copy-fen">Copy FEN</button></div>
      <label for="engine">Stockfish 19 executable (trusted build verified before use)</label>
      <input id="engine" placeholder="Full path to your Stockfish .exe">
      <label for="depth">Analysis depth (admin only; others use depth 46)</label>
      <input id="depth" type="number" min="8" max="60" value="46" disabled>
      <div id="engine-status" class="status"></div>
      <div class="row"><button id="remove" style="display:none">Remove saved move</button></div>
    </details>
    <div class="row"><button id="analyze">Find and save best move</button></div>
    <progress id="analysis-progress" max="100" value="0"></progress>
    <label id="active-jobs-label">Running analyses and results</label><ul id="active-jobs"></ul>
    <label>Evaluation</label><input id="evaluation" readonly>
    <label>Depth / nodes</label><input id="depth-result" readonly>
    <label>Best line / database moves</label><div id="notation" class="notation"></div>
    <label id="saved-list-label">Saved positions</label><ul id="saved-list"></ul>
    <div id="status" class="status"></div>
  </aside>
</main>
<script>
const symbols = {K:"♔",Q:"♕",R:"♖",B:"♗",N:"♘",P:"♙",k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"};
const boardEl = document.querySelector("#board"), annotationLayer = document.querySelector("#annotation-layer"), fenEl = document.querySelector("#fen");
const savedList = document.querySelector("#saved-list"), notationEl = document.querySelector("#notation");
function ensureUserId() {

    localStorage.setItem("chessdb_user_id", id);

}
let state = { board: [], turn:"w", castling:"-", ep:"-", selected:null, last:null, lastSound:"move", captured:{w:[],b:[]}, savedMove:null, saved:[], analysis:null, history:[], historyIndex:0, openingMoves:[], openingTracking:false, flipped:false, annotations:[], annotationStart:null, suppressRightAnnotation:false, lichessRetryUntil:0, dragging:false, pointerStart:null, pointerCurrent:null, dragPreview:null, ignoreNextClick:false, userId: ensureUserId(), adminToken: localStorage.getItem("chessdb_admin_token")||"", isAdmin:false };
let audioContext=null;
function status(text) { document.querySelector("#status").textContent=text; }

      capture:[[330,0.08,0.06,0],[220,0.12,0.07,0]],
      castle:[[392,0.07,0.04,0],[523,0.13,0.07,0]],
      check:[[660,0.08,0.05,0],[880,0.14,0.08,0]],
      mate:[[660,0.08,0.06,0],[523,0.08,0.06,0],[330,0.2,0.1,0]],

function positionKey(fen) { return fen.trim().split(/\s+/).slice(0,4).join(" "); }
function savedMatch(fen) {

  const exact=state.saved.find(x=>positionKey(x.fen)===positionKey(fen));

    const saved=x.fen.trim().split(/\s+/);

function applySavedMatch(fen) {

function currentFen() {

}
function squareName(index) { return "abcdefgh"[index%8] + (8-Math.floor(index/8)); }
function positionSnapshot() {
  return {
    board:state.board.map(row=>row.slice()),
    turn:state.turn,
    castling:state.castling,
    ep:state.ep,
    last:state.last,
    lastSound:state.lastSound,
    captured:{w:[...state.captured.w],b:[...state.captured.b]},

function flipPreferenceKey() { return `chessdb_flipped_positions:${state.userId}`; }

}
function rememberFlipForPosition(fen=currentFen()) {

    const preferences=flipPreferences();

    while(Object.keys(preferences).length>256) delete preferences[Object.keys(preferences)[0]];

}
function snapshotFen(position) {
  const rows=position.board.map(row=>{let s="",empty=0;for(const piece of row){if(!piece) empty++;else{if(empty){s+=empty;empty=0;}s+=piece;}}if(empty)s+=empty;return s;}).join("/");

}
function updateHistoryControls() {

  document.querySelector("#history-back").disabled=state.historyIndex<=0;
  document.querySelector("#history-forward").disabled=state.historyIndex>=state.history.length-1;
  document.querySelector("#history-last").disabled=state.historyIndex>=state.history.length-1;
}
function showHistoryPosition(index) {
  if(index<0||index>=state.history.length) return;

  const previousIndex=state.historyIndex;
  const previousPosition=state.history[previousIndex];
  state.historyIndex=index;
  const position=state.history[index];
  state.board=position.board.map(row=>row.slice());
  state.turn=position.turn;
  state.castling=position.castling;
  state.ep=position.ep;
  state.last=position.last;
  state.lastSound=position.lastSound||"move";
  state.captured=position.captured
    ? {w:[...position.captured.w],b:[...position.captured.b]}

  state.openingTracking=position.openingTracking;
  state.openingMoves=position.openingMoves.slice();
  state.selected=null;
  state.annotations=[];
  state.annotationStart=null;
  state.pointerStart=null;
  state.pointerCurrent=null;
  state.dragging=false;

  fenEl.value=currentFen();
  applySavedMatch(fenEl.value);

}
function parseFen(fen, openingMoves=null, positionHistory=null) {

function moveSquares(uci) { return uci ? [("abcdefgh".indexOf(uci[0]) + (8-+uci[1])*8), ("abcdefgh".indexOf(uci[2]) + (8-+uci[3])*8)] : []; }

function displaySquare(index) {

function renderAnnotations() {

function renderMaterialStatus() {

  for(const [color,label] of [["w","White captured"],["b","Black captured"]]) {
    const row=document.createElement("div");

    row.appendChild(name);

function render() {

    if(requestId!==openingRequestId) return;
    const opening=result.name
      ? `${result.eco} · ${result.name}`
      : "Unclassified opening";
    panel.textContent=`Opening: ${opening}${result.line?` — ${result.line}`:""}`;
  } catch(error) {
    if(requestId===openingRequestId) panel.textContent=`Opening lookup failed: ${error.message}`;
  }
}
async function refreshSaved() { const r=await fetch("/api/saved"); state.saved=await r.json(); renderSaved(); applySavedMatch(currentFen()); render(); }
function renderSaved(){ savedList.innerHTML=""; state.saved.forEach((x,i)=>{const li=document.createElement("li"),b=document.createElement("button");b.textContent=`${x.move_san}  |  ${x.fen.split(" ")[0]}`;b.onclick=()=>{parseFen(x.fen);notationEl.textContent=x.pv.join(" ");document.querySelector("#evaluation").value=x.evaluation;document.querySelector("#depth-result").value=x.depth||"";status("Saved best move highlighted");};li.appendChild(b);savedList.appendChild(li);}); }
async function saveAnalysisFor(fen, analysis) {
  if(!analysis?.move_uci) throw Error("No best move was returned");
  const d=await api("/api/saved",{
    fen,
    move_uci:analysis.move_uci,
    move_san:analysis.pv_san[0],
    pv:analysis.pv_san,
    evaluation:analysis.evaluation,
    depth:analysis.depth||"",
    source:analysis.source||"Stockfish 19",
    saved_at:new Date().toISOString()
  });
  state.saved=d;
  await refreshSaved();
  playMoveSound("complete");
}
const activeJobs = new Map();
const openingLookups = new Map();
function analysisContextKey() { return `chessdb_analysis_context:${state.userId}`; }
function readAnalysisContexts() {
  try {
    const contexts=JSON.parse(localStorage.getItem(analysisContextKey())||"{}");
    return contexts&&typeof contexts==="object"&&!Array.isArray(contexts)?contexts:{};
  } catch(error) {
    console.warn("Could not read saved analysis context",error);
    return {};
  }
}
function saveAnalysisContext(jobId, job) {
  try {
    const contexts=readAnalysisContexts();
    contexts[jobId]={
      openingMoves:job.openingMoves,
      positionHistory:job.positionHistory,
      flipped:job.flipped
    };
    localStorage.setItem(analysisContextKey(),JSON.stringify(contexts));
  } catch(error) {
    console.warn("Could not save analysis context",error);
  }
}
function removeAnalysisContext(jobId) {
  try {
    const contexts=readAnalysisContexts();
    if(!Object.hasOwn(contexts,jobId)) return;
    delete contexts[jobId];
    localStorage.setItem(analysisContextKey(),JSON.stringify(contexts));
  } catch(error) {
    console.warn("Could not remove saved analysis context",error);
  }
}
function jobMatchesCurrent(job) { return positionKey(job.fen)===positionKey(currentFen()); }
async function restoreActiveAnalyses() {
  const response=await fetch("/api/analyze",{headers:authHeaders()});
  const jobs=await response.json();
  if(!response.ok) throw Error(jobs.error||"Could not restore running analyses");
  const contexts=readAnalysisContexts();
  for(const savedJob of jobs) {
    if(!savedJob.job_id || !savedJob.fen)
      throw Error("The server returned an incomplete running analysis.");
    const key=positionKey(savedJob.fen);
    if(activeJobs.has(key)) continue;
    const savedContext=contexts[savedJob.job_id]||{};
    const target=savedJob.target_depth||46;
    const depth=savedJob.depth||0;
    const job={
      fen:savedJob.fen,
      flipped:typeof savedJob.flipped==="boolean"?savedJob.flipped:!!savedContext.flipped,
      cancelled:false,
      finished:false,
      completed:false,
      stockfishJobId:savedJob.job_id,
      depth,
      progress:savedJob.progress||0,
      target,
      statusText:savedJob.status==="paused"
        ? `Paused at depth ${depth}/${target}`
        : `Analyzing Stockfish... depth ${depth}/${target}`,
      paused:savedJob.status==="paused",
      openingMoves:Array.isArray(savedJob.opening_moves)
        ? [...savedJob.opening_moves]
        : Array.isArray(savedContext.openingMoves)?[...savedContext.openingMoves]:null,
      positionHistory:Array.isArray(savedJob.position_history)
        ? savedJob.position_history.map(position=>({
          ...position,
          board:Array.isArray(position.board)?position.board.map(row=>[...row]):[],
          openingMoves:Array.isArray(position.openingMoves)?[...position.openingMoves]:[],
          captured:position.captured
            ? {w:[...(position.captured.w||[])],b:[...(position.captured.b||[])]}
            : {w:[],b:[]}
        }))
        : Array.isArray(savedContext.positionHistory)
          ? savedContext.positionHistory
          : null
    };
    activeJobs.set(key,job);
    void lookupOpeningForJob(job);
  }
  renderActiveJobs();
  setAnalyzeButtonLabel();
  syncAnalysisProgressForCurrentPosition();
  for(const job of activeJobs.values()) {
    if(!job.stockfishJobId || job.finished) continue;
    void (async()=>{
      try {
        const analysis=await pollStockfishJob(job,job.stockfishJobId);
        if(!analysis) return;
        await saveAnalysisFor(job.fen,analysis);
        completeAnalysisJob(job);
      } catch(error) {
        job.statusText=error.message;
        job.finished=true;
        updateJobProgressUI(job);
      } finally {
        renderActiveJobs();
        setAnalyzeButtonLabel();
        if(jobMatchesCurrent(job)) syncAnalysisProgressForCurrentPosition();
      }
    })();
  }
}
function setAnalyzeButtonLabel() {
  const job=activeJobs.get(positionKey(currentFen()));
  document.querySelector("#analyze").textContent=job&&!job.finished?"Stop analysis":"Find and save best move";
}
function loadJobPosition(job) {
  parseFen(job.fen,job.openingMoves,job.positionHistory);
  state.flipped=!!job.flipped;
  if(state.history[state.historyIndex]) state.history[state.historyIndex].flipped=state.flipped;
  rememberFlipForPosition(job.fen);
  render();
  status(job.openingName?`Loaded ${job.openingName}`:"Loaded analyzed position");
}
function dismissAnalysisJob(job) {
  const key=positionKey(job.fen);
  if(job.stockfishJobId) removeAnalysisContext(job.stockfishJobId);
  if(activeJobs.get(key)===job) activeJobs.delete(key);
  renderActiveJobs();
  setAnalyzeButtonLabel();
  syncAnalysisProgressForCurrentPosition();
}
function completeAnalysisJob(job) {
  job.completed=true;
  job.finished=true;
  job.progress=100;
  job.statusText="Analysis complete. Best move saved.";
  if(job.stockfishJobId) removeAnalysisContext(job.stockfishJobId);
  updateJobProgressUI(job);
}
function renderActiveJobs() {
  const list=document.querySelector("#active-jobs"), label=document.querySelector("#active-jobs-label");
  const currentKeys=new Set();
  for(const job of activeJobs.values()){
    const key=positionKey(job.fen);
    currentKeys.add(key);
    let elements=job.elements;
    if(!elements) {
      const li=document.createElement("li");
      li.dataset.jobKey=key;
      const openingButton=document.createElement("button");
      openingButton.className="job-opening";
      openingButton.onclick=()=>{
        playMoveSound("ui");
        loadJobPosition(job);
      };
      const statusSpan=document.createElement("span");
      statusSpan.className="job-status";
      li.append(openingButton,statusSpan);
      list.appendChild(li);
      elements=job.elements={li,openingButton,statusSpan,actionMode:null};
    }
    const openingText=job.openingName
      ? `${job.openingEco} · ${job.openingName}${job.openingLine?` — ${job.openingLine}`:""}`
      : job.openingLookupPending
        ? "Looking up opening..."
        : job.openingError
          ? "Opening lookup failed"
          : "Unclassified opening";
    const openingTitle=`${job.openingError?`${job.openingError}\n`:""}${job.fen}`;
    if(elements.openingButton.textContent!==openingText) elements.openingButton.textContent=openingText;
    if(elements.openingButton.title!==openingTitle) elements.openingButton.title=openingTitle;
    const openingLabel=`Load analyzed position: ${openingText}`;
    if(elements.openingButton.getAttribute("aria-label")!==openingLabel)
      elements.openingButton.setAttribute("aria-label",openingLabel);
    const statusText=job.statusText||"Queued...";
    if(elements.statusSpan.textContent!==statusText) elements.statusSpan.textContent=statusText;
    const actionMode=job.awaitingCloudFallback?"fallback":job.finished?"finished":"running";
    if(elements.actionMode!==actionMode) {
      elements.li.querySelector(".job-actions, .job-dismiss, .job-running-actions")?.remove();
      elements.actionMode=actionMode;
    }
    if(actionMode==="fallback" && !elements.li.querySelector(".job-actions")) {
      const actions=document.createElement("span"); actions.className="job-actions";
      const fallbackBtn=document.createElement("button");
      fallbackBtn.textContent="Use Stockfish";
      fallbackBtn.setAttribute("aria-label","Continue with Stockfish");
      fallbackBtn.onclick=()=>continueWithStockfishFallback(job);
      const dismissBtn=document.createElement("button");
      dismissBtn.textContent="Dismiss";
      dismissBtn.setAttribute("aria-label","Dismiss rate-limit fallback choice");
      dismissBtn.onclick=()=>dismissCloudFallbackChoice(job);
      actions.append(fallbackBtn,dismissBtn);
      elements.li.appendChild(actions);
    } else if(actionMode==="finished" && !elements.li.querySelector(".job-dismiss")) {
      const dismissBtn=document.createElement("button");
      dismissBtn.className="job-dismiss";
      dismissBtn.textContent="Dismiss";
      dismissBtn.setAttribute("aria-label","Dismiss completed analysis");
      dismissBtn.onclick=()=>dismissAnalysisJob(job);
      elements.li.appendChild(dismissBtn);
    } else if(actionMode==="running") {
      let actions=elements.li.querySelector(".job-running-actions");
      if(!actions) {
        actions=document.createElement("span");
        actions.className="job-actions job-running-actions";
        const pauseBtn=document.createElement("button");
        pauseBtn.onclick=()=>job.paused?resumeAnalysisJob(job):pauseAnalysisJob(job);
        const stopBtn=document.createElement("button");
        stopBtn.textContent="Stop";
        stopBtn.onclick=()=>stopAnalysisJob(job);
        actions.append(pauseBtn,stopBtn);
        elements.li.appendChild(actions);
      }
      const pauseBtn=actions.children[0];
      const pauseLabel=job.paused?"Resume":"Pause";
      if(pauseBtn.textContent!==pauseLabel) pauseBtn.textContent=pauseLabel;
      pauseBtn.disabled=!job.stockfishJobId||job.cancelled;
    }
  }
  for(const li of [...list.children])
    if(!currentKeys.has(li.dataset.jobKey)) li.remove();
  const hasJobs=activeJobs.size>0;
  list.style.display=hasJobs?"block":"none";
  label.style.display=hasJobs?"block":"none";
}
function syncAnalysisProgressForCurrentPosition() {
  const job=activeJobs.get(positionKey(currentFen()));
  const progress=document.querySelector("#analysis-progress");
  if(job){
    progress.style.display="block";
    progress.value=job.progress||0;
    status(job.statusText||"");
  } else {
    progress.style.display="none";
  }
}
function updateJobProgressUI(job) {
  renderActiveJobs();
  if(jobMatchesCurrent(job)) syncAnalysisProgressForCurrentPosition();
}
function dismissCloudFallbackChoice(job) {
  job.awaitingCloudFallback=false;
  job.finished=true;
  job.statusText=job.rateLimitMessage;
  updateJobProgressUI(job);
  setAnalyzeButtonLabel();
}
async function continueWithStockfishFallback(job) {
  if(job.cancelled || !job.awaitingCloudFallback) return;
  job.awaitingCloudFallback=false;
  job.statusText="Starting Stockfish after Lichess Cloud rate limit...";
  updateJobProgressUI(job);
  try {
    const analysis=await analyzeWithStockfish(job,job.fen,job.target);
    if(!analysis) return;
    await saveAnalysisFor(job.fen,analysis);
    completeAnalysisJob(job);
  } catch(e) {
    job.statusText=e.message;
    job.finished=true;
    updateJobProgressUI(job);
  } finally {
    if(jobMatchesCurrent(job)) syncAnalysisProgressForCurrentPosition();
    setAnalyzeButtonLabel();
  }
}
async function lookupOpeningForJob(job) {
  const key=`${positionKey(job.fen)}|${job.openingMoves?.join(" ")||""}`;
  let lookup=openingLookups.get(key);
  if(!lookup){
    lookup=api("/api/opening",{fen:job.fen,...(job.openingMoves?{moves:job.openingMoves}:{})})
      .then(result=>({name:result.name,eco:result.eco,line:result.line}))
      .catch(error=>({error:error.message}));
    openingLookups.set(key,lookup);
  }
  job.openingLookupPending=true;
  updateJobProgressUI(job);
  const result=await lookup;
  job.openingLookupPending=false;
  if(result.error) {
    if(openingLookups.get(key)===lookup) openingLookups.delete(key);
    job.openingError=result.error;
  }
  else { job.openingName=result.name; job.openingEco=result.eco; job.openingLine=result.line; }
  updateJobProgressUI(job);
}
async function stopAnalysisJob(job) {
  if(!job || job.cancelled) return;
  job.cancelled=true;
  job.statusText="Stopping analysis...";
  updateJobProgressUI(job);
  if(job.stockfishJobId) {
    try { await fetch(`/api/analyze/${job.stockfishJobId}/stop`,{method:"POST",headers:authHeaders()}); } catch(e) {}
  }
}
async function pauseAnalysisJob(job) {
  if(!job || job.cancelled || !job.stockfishJobId || job.paused) return;
  try {
    const r=await fetch(`/api/analyze/${job.stockfishJobId}/pause`,{method:"POST",headers:authHeaders()});
    if(!r.ok) { const d=await r.json().catch(()=>({})); throw Error(d.error||"Could not pause analysis"); }
    job.paused=true;
    job.statusText=`Paused at depth ${job.depth||0}/${job.target||"?"}`;
  } catch(e) { job.statusText=e.message; }
  updateJobProgressUI(job);
}
async function resumeAnalysisJob(job) {
  if(!job || job.cancelled || !job.stockfishJobId || !job.paused) return;
  try {
    const r=await fetch(`/api/analyze/${job.stockfishJobId}/resume`,{method:"POST",headers:authHeaders()});
    if(!r.ok) { const d=await r.json().catch(()=>({})); throw Error(d.error||"Could not resume analysis"); }
    job.paused=false;
    job.statusText=`Analyzing Stockfish... depth ${job.depth||0}/${job.target||"?"}`;
  } catch(e) { job.statusText=e.message; }
  updateJobProgressUI(job);
}
async function analyzeWithStockfish(job, fen, target) {
  job.target=target;
  job.statusText=`Analyzing Stockfish... depth 0/${target}`;
  updateJobProgressUI(job);
  const started=await api("/api/analyze",{
    fen,
    engine_path:document.querySelector("#engine").value,
    depth:target,
    opening_moves:job.openingMoves,
    position_history:job.positionHistory,
    flipped:job.flipped
  });
  job.stockfishJobId=started.job_id;
  saveAnalysisContext(started.job_id,job);
  if(job.cancelled) {
    try { await fetch(`/api/analyze/${started.job_id}/stop`,{method:"POST",headers:authHeaders()}); } catch(e) {}
    job.statusText="Analysis stopped"; updateJobProgressUI(job);
    return null;
  }
  return pollStockfishJob(job,started.job_id);
}
async function pollStockfishJob(job, jobId) {
  let d;
  for(let attempt=0;attempt<86400;attempt++){
    if(job.cancelled) { job.statusText="Analysis stopped"; updateJobProgressUI(job); return null; }
    await new Promise(r=>setTimeout(r,500));
    const response=await fetch(`/api/analyze/${jobId}`,{headers:authHeaders()});
    d=await response.json();
    if(!response.ok) throw Error(d.error||"Could not retrieve Stockfish analysis progress");
    if(d.status==="running"){
      job.paused=false;
      job.depth=d.depth||0;
      job.progress=d.progress||0;
      job.statusText=`Analyzing Stockfish... depth ${job.depth}/${d.target_depth}`;
      updateJobProgressUI(job);
      continue;
    }
    if(d.status==="paused"){
      job.paused=true;
      job.depth=d.depth||0;
      job.statusText=`Paused at depth ${job.depth}/${d.target_depth}`;
      updateJobProgressUI(job);
      continue;
    }
    break;
  }
  if(job.cancelled || d?.status==="stopped") {
    job.finished=true;
    job.statusText="Analysis stopped";
    removeAnalysisContext(jobId);
    updateJobProgressUI(job);
    return null;
  }
  if(!d||d.status==="running"||d.status==="paused") throw Error("Stockfish analysis did not finish within 12 hours");
  if(d.status==="error") throw Error(d.error);
  if(d.status!=="complete"||!d.result) throw Error("Stockfish returned an invalid analysis status.");
  job.progress=100;
  updateJobProgressUI(job);
  return {...d.result,source:"Stockfish 19"};
}

document.querySelector("#analyze").onclick=async()=>{
  playMoveSound("ui");
  const fen=currentFen();
  const key=positionKey(fen);
  const existing=activeJobs.get(key);
  if(existing) {
    if(!existing.finished) await stopAnalysisJob(existing);
    else status("Dismiss the finished result before analyzing this position again.");
    return;
  }
  rememberFlipForPosition(fen);
  const job={fen,flipped:state.flipped,cancelled:false,finished:false,completed:false,stockfishJobId:null,depth:0,progress:0,target:0,statusText:"Queued...",openingMoves:state.openingTracking?[...state.openingMoves]:null,positionHistory:state.history.slice(0,state.historyIndex+1).map(position=>({...position,board:position.board.map(row=>row.slice()),openingMoves:[...(position.openingMoves||[])],captured:position.captured?{w:[...position.captured.w],b:[...position.captured.b]}:{w:[],b:[]}}))};
  activeJobs.set(key,job);
  setAnalyzeButtonLabel();
  updateJobProgressUI(job);
  void lookupOpeningForJob(job);
  const target=+document.querySelector("#depth").value;
  job.target=target;
  try{
    const remaining=Math.ceil((state.lichessRetryUntil-Date.now())/1000);
    if(remaining>0) {
      const error=new Error(`Lichess Cloud rate limit. Try again in about ${remaining} seconds.`);
      error.code="LICHESS_RATE_LIMIT";
      throw error;
    }
    job.statusText="Querying Lichess Cloud Evaluation...";
    updateJobProgressUI(job);
    let d;
    try {
      d=await api("/api/lichess",{fen});
    } catch(e) {
      if(e.code!=="LICHESS_RATE_LIMIT") throw e;
      job.awaitingCloudFallback=true;
      job.rateLimitMessage=e.message;
      job.statusText="Lichess Cloud rate limit. Choose whether to continue with Stockfish.";
      updateJobProgressUI(job);
      return;
    }
    if(job.cancelled) return;
    const lines=d.lines||[];
    if(lines.length){
      if(jobMatchesCurrent(job))
        notationEl.textContent=lines.map(x=>`${x.pv_san.join(" ")} (${x.evaluation})`).join(" | ");
      const cloudDepth=Number(d.depth)||0;
      if(cloudDepth>=target){
        const first=lines[0];
        const analysis={
          move_uci:first.move_uci,
          pv_san:first.pv_san,
          evaluation:`Lichess Cloud: ${first.evaluation}`,
          depth:`Depth ${d.depth} | ${d.knodes}k nodes`,
          source:"Lichess Cloud Evaluation"
        };
        await saveAnalysisFor(fen,analysis);
        completeAnalysisJob(job);
      } else {
        job.statusText=`Lichess depth ${d.depth||0} is below target ${target}; starting Stockfish...`;
        updateJobProgressUI(job);
        const analysis=await analyzeWithStockfish(job,fen,target);
        if(!analysis) return;
        await saveAnalysisFor(fen,analysis);
        completeAnalysisJob(job);
      }
    } else {
      job.statusText="No suitable Lichess cache; starting Stockfish...";
      updateJobProgressUI(job);
      const analysis=await analyzeWithStockfish(job,fen,target);
      if(!analysis) return;
      await saveAnalysisFor(fen,analysis);
      completeAnalysisJob(job);
    }
    if(jobMatchesCurrent(job)) setTimeout(()=>{ if(!activeJobs.has(key)) syncAnalysisProgressForCurrentPosition(); },800);
  }catch(e){
    job.statusText=e.message;
    job.finished=true;
    updateJobProgressUI(job);
  }
  finally{
    if(!job.finished && !job.awaitingCloudFallback) {
      job.finished=true;
      if(job.cancelled) job.statusText="Analysis stopped.";
    }
    renderActiveJobs();
    setAnalyzeButtonLabel();
    if(jobMatchesCurrent(job)) syncAnalysisProgressForCurrentPosition();
  }
};
